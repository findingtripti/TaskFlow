<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow – Page Not Found</title>
  <script>(function(){var t=localStorage.getItem('tf_theme');if(t==='dark'){document.documentElement.classList.add('dark-mode');document.addEventListener('DOMContentLoaded',function(){document.body.classList.add('dark-mode');});}})();</script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="error-page">
  <div style="text-align:center;">
    <div class="error-code">404</div>
    <h2 style="font-size:1.5rem;font-weight:700;color:var(--text-primary);margin-bottom:.5rem;">Page Not Found</h2>
    <p class="error-msg">The page you're looking for doesn't exist or has been moved.</p>
    <a href="login.html" class="btn-tf-primary" style="display:inline-flex;align-items:center;gap:.4rem;padding:.625rem 1.5rem;margin-bottom:1rem;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      Back to Home
    </a>
    <div style="margin-top:.75rem;">
      <a href="dashboard.html" style="color:var(--tf-primary);font-size:.875rem;margin-right:1rem;">Dashboard</a>
      <a href="tasks.html" style="color:var(--tf-primary);font-size:.875rem;">My Tasks</a>
    </div>
  </div>
</div>
</body>
</html>
