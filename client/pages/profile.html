<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow – Profile</title>
  <script>(function(){var t=localStorage.getItem('tf_theme');if(t==='dark'){document.documentElement.classList.add('dark-mode');document.addEventListener('DOMContentLoaded',function(){document.body.classList.add('dark-mode');});}})();</script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-brand-icon">TF</div>
      <span class="sidebar-brand-name">TaskFlow</span>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-section-label">Main</div>
      <a href="dashboard.html">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
        Dashboard
      </a>
      <a href="tasks.html">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
        My Tasks
      </a>
      <div class="sidebar-section-label">Account</div>
      <a href="profile.html" class="active">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Profile
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-avatar" id="sidebarAvatar">U</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name" id="sidebarName">Loading…</div>
          <div class="sidebar-user-role" id="sidebarRole">user</div>
        </div>
      </div>
      <div class="sidebar-actions">
        <button class="sidebar-action-btn theme-toggle" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle theme">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          Theme
        </button>
        <button class="sidebar-logout-btn" onclick="logout()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Sign Out
        </button>
      </div>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

  <div class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <button class="sidebar-toggle" onclick="toggleSidebar()" aria-label="Toggle sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <span class="topbar-title">Profile</span>
      </div>
      <div class="topbar-right">
        <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle dark/light mode">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </header>

    <main class="content-area">
      <div class="page-header">
        <div class="page-header-left">
          <h1>My Profile</h1>
          <p>Manage your account information and security settings.</p>
        </div>
      </div>

      <div class="row g-3">
        <!-- Left: Profile info + Password -->
        <div class="col-12 col-lg-8">
          <!-- Personal Info Card -->
          <div class="tf-card mb-3">
            <div class="tf-card-header">
              <h2 class="tf-card-title">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:.5rem;vertical-align:middle;color:var(--tf-primary);"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                Personal Information
              </h2>
            </div>
            <div class="tf-card-body">
              <div id="profile-success" class="alert alert-success d-none"></div>
              <div id="profile-error" class="alert alert-danger d-none"></div>
              <form id="profileForm" novalidate>
                <div class="row g-3">
                  <div class="col-12 col-md-6">
                    <label class="form-label">Full Name</label>
                    <div class="input-group">
                      <svg class="input-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                      <input type="text" id="profileName" class="form-control" placeholder="Your full name" />
                    </div>
                    <div class="invalid-feedback" id="profileName-err"></div>
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="form-label">Email Address</label>
                    <div class="input-group">
                      <svg class="input-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                      <input type="email" id="profileEmail" class="form-control" disabled />
                    </div>
                    <small style="font-size:.72rem;color:var(--text-muted);">Email address cannot be changed.</small>
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="form-label">Role</label>
                    <input type="text" id="profileRole" class="form-control" disabled style="text-transform:capitalize;" />
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="form-label">Member Since</label>
                    <input type="text" id="profileCreated" class="form-control" disabled />
                  </div>
                </div>
                <div style="margin-top:1.25rem;padding-top:1.25rem;border-top:1px solid var(--border-color);">
                  <button type="submit" id="profileSaveBtn" class="btn-tf-primary">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/></svg>
                    Save Changes
                  </button>
                </div>
              </form>
            </div>
          </div>

          <!-- Change Password Card -->
          <div class="tf-card">
            <div class="tf-card-header">
              <h2 class="tf-card-title">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:.5rem;vertical-align:middle;color:var(--tf-warning);"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                Change Password
              </h2>
            </div>
            <div class="tf-card-body">
              <div id="pw-success" class="alert alert-success d-none"></div>
              <div id="pw-error" class="alert alert-danger d-none"></div>
              <form id="passwordForm" novalidate>
                <div class="row g-3">
                  <div class="col-12">
                    <label class="form-label">Current Password</label>
                    <div class="input-group">
                      <svg class="input-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                      <input type="password" id="currentPassword" class="form-control" placeholder="Enter your current password" />
                    </div>
                    <div class="invalid-feedback" id="currentPassword-err"></div>
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="form-label">New Password</label>
                    <div class="input-group">
                      <svg class="input-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
                      <input type="password" id="newPassword" class="form-control" placeholder="Min. 6 characters" />
                    </div>
                    <div class="invalid-feedback" id="newPassword-err"></div>
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="form-label">Confirm New Password</label>
                    <div class="input-group">
                      <svg class="input-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
                      <input type="password" id="confirmNewPassword" class="form-control" placeholder="Repeat new password" />
                    </div>
                    <div class="invalid-feedback" id="confirmNewPassword-err"></div>
                  </div>
                </div>
                <div style="margin-top:1.25rem;padding-top:1.25rem;border-top:1px solid var(--border-color);">
                  <button type="submit" id="pwSaveBtn" class="btn-tf-primary">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    Update Password
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>

        <!-- Right: Avatar + Task Summary -->
        <div class="col-12 col-lg-4">
          <!-- Profile Card -->
          <div class="tf-card mb-3" style="text-align:center;">
            <div class="tf-card-body">
              <div style="width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--tf-primary),#7c3aed);display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:800;color:#fff;margin:0 auto 1rem;box-shadow:0 8px 24px rgba(79,70,229,.3);"
                   id="profileAvatar">U</div>
              <h5 id="profileDisplayName" style="font-weight:700;margin-bottom:.25rem;color:var(--text-primary);">–</h5>
              <p id="profileDisplayEmail" style="color:var(--text-muted);font-size:.8125rem;margin:.25rem 0;"></p>
              <span id="profileDisplayRole" class="badge-status badge-inprogress mt-2" style="font-size:.72rem;">user</span>
            </div>
          </div>

          <!-- Task Summary Card -->
          <div class="tf-card">
            <div class="tf-card-header">
              <h2 class="tf-card-title">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:.5rem;vertical-align:middle;color:var(--tf-success);"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
                Task Summary
              </h2>
            </div>
            <div>
              <div class="task-item" style="padding:.875rem 1.25rem;">
                <span style="font-size:.875rem;color:var(--text-muted);">Total Tasks</span>
                <span style="margin-left:auto;font-weight:700;color:var(--text-primary);" id="ps-total">–</span>
              </div>
              <div class="task-item" style="padding:.875rem 1.25rem;">
                <span style="font-size:.875rem;color:var(--text-muted);">Completed</span>
                <span style="margin-left:auto;font-weight:700;color:var(--tf-success);" id="ps-completed">–</span>
              </div>
              <div class="task-item" style="padding:.875rem 1.25rem;">
                <span style="font-size:.875rem;color:var(--text-muted);">Pending</span>
                <span style="margin-left:auto;font-weight:700;color:var(--tf-warning);" id="ps-pending">–</span>
              </div>
              <div class="task-item" style="padding:.875rem 1.25rem;border:none;">
                <span style="font-size:.875rem;color:var(--text-muted);">High Priority</span>
                <span style="margin-left:auto;font-weight:700;color:var(--tf-danger);" id="ps-high">–</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<div id="toastContainer" class="tf-toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/profile.js"></script>
</body>
</html>
